<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - FlameNet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">FlameNet</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main>
    <section id="login-section">
      <h1>Iniciar sesión</h1>
      <p>Ingresa con tu cuenta existente.</p>

      <p id="msg-error"   class="msg error"   hidden></p>
      <p id="msg-success" class="msg success" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required autocomplete="current-password" />
        </div>
        <button type="submit">Iniciar sesión</button>
      </form>

      <div class="divider-or"><span>o</span></div>

      <button class="btn-google" disabled>
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="16" height="16" />
        Continuar con Google
      </button>

      <p class="form-footer">
        ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 FlameNet &mdash; Proyecto Tecnologías Web. Todos los derechos reservados.</p>
  </footer>

<script>
  const API_BASE = window.location.origin;

  document.getElementById('nav-toggle').addEventListener('click', function() {
    document.getElementById('nav-menu').classList.toggle('open');
  });

  function showMsg(id, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.hidden = false;
    setTimeout(() => { el.hidden = true; }, 4000);
  }

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      return showMsg('msg-error', 'Por favor completa todos los campos.');
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        return showMsg('msg-error', data.error);
      }

      // Guardar token y nombre en localStorage
      localStorage.setItem('flamenet_token', data.token);
      localStorage.setItem('flamenet_name',  data.name);

      showMsg('msg-success', '¡Bienvenido de nuevo, ' + data.name.split(' ')[0] + '!');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);

    } catch (err) {
      showMsg('msg-error', 'No se pudo conectar con el servidor. ¿Está corriendo?');
    }
  });
</script>
</body>
</html>
